name: Atualizar números

# A barra de prova mostra commits, PRs aceitos e meses de operação. Se esses
# valores ficarem parados no dia em que a página foi escrita, viram mentira em
# poucos meses. Toda segunda de manhã o job relê a API do GitHub e, quando algo
# mudou de verdade, commita o arquivo. O commit dispara o workflow de deploy.
on:
  schedule:
    # 09:00 UTC de segunda, que é 06:00 em Vitória.
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    name: Reler a API do GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # O push deste job precisa sair com credencial de PESSOA, e nao com o
          # GITHUB_TOKEN padrão. O Actions não dispara workflow nenhum para um
          # evento criado com o próprio GITHUB_TOKEN, que é a proteção contra
          # loop infinito, e o efeito colateral aqui era grave e silencioso: o
          # robô commitava os números novos, o deploy não rodava, e o site
          # seguia mostrando os antigos até alguém empurrar algo à mão.
          #
          # Medido em 24/08/2026: o commit ca46e52 atualizou o arquivo e nenhum
          # deploy foi disparado.
          #
          # Sem STATS_TOKEN cai no padrão e volta a não disparar, o que é apenas
          # o comportamento antigo, não uma regressão nova.
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Buscar estatísticas
        env:
          # STATS_TOKEN primeiro, e a ordem importa. O GITHUB_TOKEN que o Actions
          # injeta é um token de instalação com escopo neste repositório apenas:
          # ele não enxerga repositório privado das outras contas, e com ele a
          # conta cai de 1397 commits para o punhado que é público.
          #
          # STATS_TOKEN precisa ser um PAT clássico com escopo "repo", do dono da
          # conta. Sem ele o script ainda roda, só que vendo apenas o que é
          # público, e a guarda de coerência recusa gravar a queda: os números
          # ficam parados no último valor bom em vez de encolherem sozinhos.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        # O script nunca falha o job: se a API cair ou o resultado vier
        # incoerente com o anterior, ele mantém o arquivo atual e sai com 0.
        run: node scripts/fetch-stats.mjs

      - name: Commitar se mudou
        run: |
          # Os dois arquivos: src/data alimenta o build, public/ e servido em
          # selflabs.org/stats.json e e de la que os badges do GitHub leem.
          if git diff --quiet -- src/data/stats.json public/stats.json; then
            echo "Nenhuma mudança nos números. Nada a fazer."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/stats.json public/stats.json
          git commit -m "chore(stats): atualiza números da barra de prova

          Gerado por scripts/fetch-stats.mjs a partir da API do GitHub."
          git push
          echo "Números atualizados. O push dispara o deploy."
