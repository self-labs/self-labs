name: Deploy

# Push na master publica o site. Nenhum passo manual, nenhum SSH.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # Um deploy por vez. Push em sequencia cancela o anterior, que ainda nao
  # chegou no ar, em vez de correr os dois e publicar o mais lento por ultimo.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar:
    name: Testar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run check

      - name: Testar conteudo
        # Segura as regras editoriais: pontuacao proibida, assunto fora de
        # escopo, par de traducao faltando, designator repetido.
        run: npm test

      - name: Construir
        env:
          # Sobe o limite da API do GitHub de 60 para 5000 chamadas por hora, o
          # que importa porque o build conta commits repositorio a repositorio.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Publicar no Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Conferir se o site respondeu
        # Publicar sem erro nao prova que o apex esta servindo.
        #
        # Se a resposta nao for 200, o passo imprime os cabecalhos de resposta
        # antes de falhar. E ai que mora a explicacao: cf-mitigated diz qual
        # camada da Cloudflare barrou, cf-ray identifica a requisicao no painel,
        # e o corpo costuma nomear o produto. Sem isso sobra adivinhacao, que ja
        # custou duas hipoteses erradas neste projeto.
        run: |
          sleep 10
          agente='selflabs-ci/1.0'
          url='https://selflabs.org/'

          codigo=$(curl -sS -o /tmp/corpo.html -D /tmp/cabecalhos.txt                         -w '%{http_code}' -A "$agente" --max-time 20 "$url")
          echo "selflabs.org respondeu $codigo"

          if [ "$codigo" = "200" ]; then
            echo "Site no ar."
            exit 0
          fi

          echo "----- cabecalhos da resposta -----"
          cat /tmp/cabecalhos.txt
          echo "----- inicio do corpo -----"
          head -c 600 /tmp/corpo.html
          echo
          echo "----- a mesma URL sem User-Agent proprio -----"
          padrao=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url")
          echo "sem UA proprio: $padrao"
          echo "----- com User-Agent de navegador -----"
          navegador=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20             -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36' "$url")
          echo "com UA de navegador: $navegador"

          echo "::error::selflabs.org respondeu $codigo para o runner. Veja os cabecalhos acima:"
          echo "::error::cf-mitigated nomeia a camada que barrou; cf-ray localiza a requisicao no painel da Cloudflare."
          exit 1
