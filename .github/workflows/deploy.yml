name: Deploy

# Push na master publica o site. Nenhum passo manual, nenhum SSH.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # Um deploy por vez. Push em sequencia cancela o anterior, que ainda nao
  # chegou no ar, em vez de correr os dois e publicar o mais lento por ultimo.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar:
    name: Testar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # Dois commits: o passo de versao compara este com o anterior.
          fetch-depth: 2
          # Nada neste workflow escreve no repositorio, entao a credencial nao
          # precisa ficar gravada no .git/config do runner pelo job inteiro.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Conferir se a versao subiu
        # A versao CalVer aparece no rodape do site. Cinco deploys sairam com o
        # mesmo 2026.8.1 porque nada obrigava a subir a revisao, e o rodape
        # passou a mentir sobre o que estava no ar. Agora o CI cobra.
        run: |
          atual=$(node -p "require('./package.json').version")

          if ! git rev-parse HEAD~1 > /dev/null 2>&1; then
            echo "Sem commit anterior para comparar. Versao atual: $atual"
            exit 0
          fi

          anterior=$(git show HEAD~1:package.json 2>/dev/null | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "")

          if [ -z "$anterior" ]; then
            echo "Nao foi possivel ler a versao anterior. Versao atual: $atual"
            exit 0
          fi

          echo "anterior: $anterior"
          echo "atual:    $atual"

          # Mudanca so em workflow ou documentacao nao exige revisao nova.
          # Os arquivos de estatística entram na lista porque quem os escreve é
          # o robô de segunda-feira, que não tem como subir revisão: ele commita
          # número, não código. Antes isso passava despercebido porque o commit
          # dele não disparava deploy nenhum. Agora que dispara, sem esta exceção
          # o deploy quebraria neste passo toda segunda.
          # O .gitignore e o CHANGELOG.md entram pelo mesmo motivo, por outro
          # caminho: nenhum dos dois altera um byte do que o visitante recebe.
          # Exigir revisão neles faz o rodapé anunciar uma mudança que o site
          # não teve, que é o contrário do que este passo existe para proteger.
          if git diff --name-only HEAD~1 HEAD | grep -qvE '^(\.github/|docs/|README\.md|AGENTS\.md|CLAUDE\.md|CHANGELOG\.md|\.gitignore|src/data/stats\.json|public/stats\.json)'; then
            if [ "$atual" = "$anterior" ]; then
              echo "::error::O codigo mudou e a versao continua $atual."
              echo "::error::Suba a revisao no package.json: o rodape do site mostra esse numero."
              exit 1
            fi
            echo "Versao subiu junto com o codigo."
          else
            echo "Mudanca apenas em workflow ou documentacao, revisao nao e exigida."
          fi

      - name: Verificar tipos
        run: npm run check

      - name: Testar conteudo
        # Segura as regras editoriais: pontuacao proibida, assunto fora de
        # escopo, par de traducao faltando, designator repetido.
        run: npm test

      - name: Construir
        env:
          # Sobe o limite da API do GitHub de 60 para 5000 chamadas por hora, o
          # que importa porque o build conta commits repositorio a repositorio.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Publicar no Cloudflare Workers
        # Fixada por SHA, e nao por tag: esta acao recebe o token que publica
        # em producao, e uma tag e mutavel, ou seja, quem controlar o
        # repositorio dela pode trocar o codigo por baixo sem mudar a
        # referencia. Atualizar junto com o Dependabot.
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Conferir se a versao publicada esta ativa
        # Por que nao um curl na URL publica: a zona roda com Bot Fight Mode do
        # plano gratuito, que responde ao runner com um desafio interativo
        # (cf-mitigated: challenge, pagina "Just a moment"). Medido: 403 tanto
        # com User-Agent proprio quanto com User-Agent de navegador, ou seja, o
        # gatilho e o IP de datacenter, nao o agente. E o Bot Fight Mode do plano
        # gratuito nao e pulavel por regra de WAF: a fase http_request_sbfm
        # pertence ao Super Bot Fight Mode, dos planos pagos.
        #
        # Entao a verificacao passa a perguntar para a propria Cloudflare qual
        # versao esta servindo, e compara com a que acabou de subir. Isso pega o
        # caso real que o wrangler sozinho nao pega: deploy aceito, mas a versao
        # antiga continuar ativa.
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sleep 5
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/selflabs-site/deployments"
          # O cabecalho entra por stdin em vez de argv: argumento de processo
          # e legivel por qualquer outro processo do runner.
          resposta=$(curl -sS --max-time 20 -H @- "$api" <<< "Authorization: Bearer $CF_API_TOKEN")

          if ! echo "$resposta" | jq -e '.success == true' > /dev/null 2>&1; then
            echo "::error::A API da Cloudflare nao respondeu como esperado:"
            echo "$resposta" | head -c 500
            exit 1
          fi

          # O deployment ativo e o primeiro da lista, e traz a data de criacao.
          criado=$(echo "$resposta" | jq -r '.result.deployments[0].created_on // empty')
          origem=$(echo "$resposta" | jq -r '.result.deployments[0].source // "desconhecida"')

          if [ -z "$criado" ]; then
            echo "::error::Nenhum deployment ativo encontrado para selflabs-site."
            exit 1
          fi

          idade=$(( $(date -u +%s) - $(date -u -d "$criado" +%s) ))
          echo "Deployment ativo criado em $criado (origem: $origem, ha ${idade}s)"

          # Um deployment com mais de dez minutos significa que este push nao
          # substituiu nada, ou seja, a versao nova nao entrou em producao.
          if [ "$idade" -gt 600 ]; then
            echo "::error::O deployment ativo tem ${idade}s de idade, mais que os 600s aceitos."
            echo "::error::O wrangler reportou sucesso, mas a versao em producao nao e a deste push."
            exit 1
          fi

          echo "Versao deste push confirmada em producao."
