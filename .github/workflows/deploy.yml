name: Deploy

# Push na master publica o site. Nenhum passo manual, nenhum SSH.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  # Um deploy por vez. Push em sequencia cancela o anterior, que ainda nao
  # chegou no ar, em vez de correr os dois e publicar o mais lento por ultimo.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar:
    name: Testar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run check

      - name: Testar conteudo
        # Segura as regras editoriais: pontuacao proibida, assunto fora de
        # escopo, par de traducao faltando, designator repetido.
        run: npm test

      - name: Construir
        env:
          # Sobe o limite da API do GitHub de 60 para 5000 chamadas por hora, o
          # que importa porque o build conta commits repositorio a repositorio.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Publicar no Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Conferir se o site respondeu
        # Publicar sem erro nao prova que o apex esta servindo. Esta checagem
        # separa "o deploy rodou" de "o site esta no ar".
        #
        # O User-Agent identifica o CI porque a zona roda com Bot Fight Mode
        # ligado, e sem uma regra de skip para este agente a Cloudflare devolve
        # 403 ao runner antes de a requisicao chegar no Worker. Esse 403 ja
        # derrubou dois deploys que estavam perfeitos, entao ele e tratado como
        # caso proprio, com instrucao de conserto, e nunca confundido com queda.
        run: |
          sleep 10
          agente='selflabs-ci/1.0'
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' -A "$agente" --max-time 20 https://selflabs.org/)
          echo "selflabs.org respondeu $codigo"

          case "$codigo" in
            200)
              echo "Site no ar."
              ;;
            403)
              echo "::error::A Cloudflare bloqueou o proprio CI (403), entao esta checagem nao conseguiu ver o site."
              echo "::error::Causa: Bot Fight Mode ligado na zona selflabs.org."
              echo "::error::Conserto: em Security, WAF, Custom rules, criar uma regra com acao Skip para"
              echo "::error::(http.user_agent eq \"selflabs-ci/1.0\" and http.host in {\"selflabs.org\" \"www.selflabs.org\"})"
              echo "::error::pulando as fases http_ratelimit, http_request_firewall_managed e http_request_sbfm,"
              echo "::error::no mesmo formato da regra Bypass Jarvis Alexa que ja existe na zona."
              exit 1
              ;;
            *)
              echo "::error::selflabs.org respondeu $codigo. O deploy subiu, mas a entrega falhou."
              exit 1
              ;;
          esac
